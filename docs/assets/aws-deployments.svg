<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="t d">
<title id="t">Two ways to self-host diffsense on AWS</title>
<desc id="d">Side by side: the small deployment, where a pull request flows through API Gateway, a queue and Lambda workers into an Aurora database that pauses when idle, for about 2 to 10 USD a month; and the full deployment, with WAF, EC2 workers that scale out and a multi-AZ database that never pauses, for about 330 USD a month.</desc>
<style>
text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #d9dee6; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
.muted { fill: #8592a3; }
.g { fill: #22C55E; } .p { fill: #a996d6; } .r { fill: #EF4444; } .b { fill: #7aa2f7; } .o { fill: #F97316; }
.node { fill: #161b22; stroke: #2d3540; stroke-width: 1.2; }
.wire { fill: none; stroke: #2d3540; stroke-width: 2; stroke-dasharray: 4 5; animation: flow 1.2s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -18; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

/* small: database awake while work flows, then pauses */
.awake { animation: awake 8s ease-in-out infinite; }
@keyframes awake { 0%,8% { opacity: 0; } 14%,52% { opacity: 1; } 60%,100% { opacity: 0; } }
.zz { animation: zz 8s ease-in-out infinite; }
@keyframes zz { 0%,56% { opacity: 0; transform: translateY(6px); } 64%,96% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.lam1 { animation: lam 8s ease-in-out infinite; }
.lam2 { animation: lam 8s ease-in-out infinite; animation-delay: .35s; }
@keyframes lam { 0%,10% { opacity: 0; transform: translateY(6px); } 16%,48% { opacity: 1; transform: none; } 56%,100% { opacity: 0; transform: translateY(6px); } }
.idle { animation: idle 8s ease-in-out infinite; }
@keyframes idle { 0%,54% { opacity: 0; } 62%,96% { opacity: 1; } 100% { opacity: 0; } }

/* full: workers scale out under load, always-on database */
.ec2b { animation: ec2b 8s cubic-bezier(.2,.8,.2,1) infinite; }
.ec2c { animation: ec2c 8s cubic-bezier(.2,.8,.2,1) infinite; }
@keyframes ec2b { 0%,18% { opacity: 0; transform: translateY(8px); } 26%,86% { opacity: 1; transform: none; } 94%,100% { opacity: 0; } }
@keyframes ec2c { 0%,34% { opacity: 0; transform: translateY(8px); } 42%,80% { opacity: 1; transform: none; } 88%,100% { opacity: 0; } }
.pulse { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

/* cost bars */
.barS { animation: barS 8s cubic-bezier(.2,.8,.2,1) infinite; }
@keyframes barS { 0%,6% { width: 0; } 30%,94% { width: 14px; } 100% { width: 0; } }
.barF { animation: barF 8s cubic-bezier(.2,.8,.2,1) infinite; }
@keyframes barF { 0%,6% { width: 0; } 40%,94% { width: 410px; } 100% { width: 0; } }
.chk { animation: chk 8s ease-out infinite; }
.c1 { animation-delay: .2s; } .c2 { animation-delay: .5s; } .c3 { animation-delay: .8s; } .c4 { animation-delay: 1.1s; }
@keyframes chk { 0%,4% { opacity: 0; transform: translateX(-10px); } 12%,96% { opacity: 1; transform: none; } 100% { opacity: 0; } }
</style>

<rect x="0.5" y="0.5" width="959" height="559" rx="10" fill="#0d1117" stroke="#262d38"/>
<rect x="1" y="1" width="958" height="44" rx="9" fill="#191e26"/>
<circle cx="24" cy="23" r="6" fill="#ff5f57"/><circle cx="44" cy="23" r="6" fill="#febc2e"/><circle cx="64" cy="23" r="6" fill="#28c840"/>
<text x="480" y="28" text-anchor="middle" class="mono muted" font-size="13">infra/aws_infraestructure/.env  ·  DIFFWISE_DEPLOYMENT=<tspan class="g">small</tspan> | <tspan class="p">full</tspan></text>

<!-- ============================== SMALL ============================== -->
<g transform="translate(20,60)">
  <rect width="450" height="482" rx="10" fill="#10151c" stroke="#22C55E" stroke-opacity=".45"/>
  <text x="20" y="38" font-size="24" font-weight="800" class="g">small</text>
  <text x="96" y="38" font-size="14" class="muted">for startups and small teams</text>
  <rect x="330" y="18" width="104" height="28" rx="14" fill="#22C55E" fill-opacity=".14" stroke="#22C55E" stroke-opacity=".6"/>
  <text x="382" y="37" text-anchor="middle" font-size="13" font-weight="700" class="g">SERVERLESS</text>

  <!-- PR chip -->
  <rect x="20" y="68" width="92" height="30" rx="15" class="node"/>
  <text x="66" y="88" text-anchor="middle" font-size="12" class="mono">PR #482</text>

  <!-- wires -->
  <path class="wire" d="M66 98 V150"/>
  <path class="wire" d="M112 185 H126 M218 185 H232 M324 185 H338"/>

  <!-- nodes -->
  <rect x="20" y="150" width="92" height="70" rx="8" class="node"/>
  <text x="66" y="180" text-anchor="middle" font-size="13" font-weight="700">API</text>
  <text x="66" y="200" text-anchor="middle" font-size="11" class="muted">Gateway</text>

  <rect x="126" y="150" width="92" height="70" rx="8" class="node"/>
  <text x="172" y="180" text-anchor="middle" font-size="13" font-weight="700">Queue</text>
  <text x="172" y="200" text-anchor="middle" font-size="11" class="muted">SQS + DLQ</text>

  <rect x="232" y="150" width="92" height="70" rx="8" class="node"/>
  <text x="278" y="180" text-anchor="middle" font-size="13" font-weight="700">Workers</text>
  <text x="278" y="200" text-anchor="middle" font-size="11" class="muted">Lambda</text>

  <rect x="338" y="150" width="92" height="70" rx="8" class="node"/>
  <rect x="338" y="150" width="92" height="70" rx="8" fill="none" stroke="#22C55E" stroke-width="2" class="awake"/>
  <text x="384" y="180" text-anchor="middle" font-size="13" font-weight="700">Aurora</text>
  <text x="384" y="200" text-anchor="middle" font-size="11" class="muted">0 → 2 ACU</text>

  <!-- one PR, then idle -->
  <circle r="6" fill="#22C55E">
    <animateMotion dur="8s" repeatCount="indefinite" path="M66 98 V185 H384" keyPoints="0;1;1" keyTimes="0;0.45;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.45;0.5;1"/>
  </circle>

  <!-- lambdas appear, then scale to zero -->
  <g transform="translate(250,236)">
    <g class="lam1"><rect width="24" height="24" rx="6" fill="#F97316" fill-opacity=".18" stroke="#F97316"/><text x="12" y="17" text-anchor="middle" font-size="14" class="o">λ</text></g>
    <g transform="translate(32,0)"><g class="lam2"><rect width="24" height="24" rx="6" fill="#F97316" fill-opacity=".18" stroke="#F97316"/><text x="12" y="17" text-anchor="middle" font-size="14" class="o">λ</text></g></g>
  </g>
  <text x="278" y="252" text-anchor="middle" font-size="11" class="muted idle">scaled to 0</text>
  <g class="zz">
    <text x="384" y="252" text-anchor="middle" font-size="13" font-weight="700" class="b">z<tspan font-size="16">Z</tspan> paused</text>
  </g>
  <text x="384" y="252" text-anchor="middle" font-size="11" class="g awake">awake</text>

  <!-- checklist -->
  <g font-size="14">
    <g class="chk c1"><text x="24" y="304" class="g">✓</text><text x="46" y="304">No NAT, no VPC endpoints, no EC2</text></g>
    <g class="chk c2"><text x="24" y="334" class="g">✓</text><text x="46" y="334">Database pauses after 5 idle minutes</text></g>
    <g class="chk c3"><text x="24" y="364" class="g">✓</text><text x="46" y="364">Workers and API scale to zero</text></g>
    <g class="chk c4"><text x="24" y="394" class="g">✓</text><text x="46" y="394">Same service code as full</text></g>
  </g>

  <!-- cost -->
  <text x="20" y="436" font-size="12" class="muted mono">AWS bill per month</text>
  <rect x="20" y="446" width="410" height="12" rx="6" fill="#1b222c"/>
  <rect x="20" y="446" width="14" height="12" rx="6" fill="#22C55E" class="barS"/>
  <text x="430" y="438" text-anchor="end" font-size="16" font-weight="800" class="g">~$2-10</text>
</g>

<!-- ============================== FULL ============================== -->
<g transform="translate(490,60)">
  <rect width="450" height="482" rx="10" fill="#12111a" stroke="#8E75B2" stroke-opacity=".55"/>
  <text x="20" y="38" font-size="24" font-weight="800" class="p">full</text>
  <text x="74" y="38" font-size="14" class="muted">for production at scale</text>
  <rect x="330" y="18" width="104" height="28" rx="14" fill="#8E75B2" fill-opacity=".16" stroke="#8E75B2" stroke-opacity=".7"/>
  <text x="382" y="37" text-anchor="middle" font-size="13" font-weight="700" class="p">ALWAYS ON</text>

  <rect x="20" y="68" width="92" height="30" rx="15" class="node"/>
  <text x="66" y="88" text-anchor="middle" font-size="12" class="mono">PRs ×100</text>

  <path class="wire" d="M66 98 V150"/>
  <path class="wire" d="M112 185 H126 M218 185 H232 M324 185 H338"/>

  <rect x="20" y="150" width="92" height="70" rx="8" class="node"/>
  <text x="66" y="180" text-anchor="middle" font-size="13" font-weight="700">API</text>
  <text x="66" y="200" text-anchor="middle" font-size="11" class="muted">+ WAF</text>
  <g class="pulse"><path d="M130 174 l10 -4 l10 4 v7 c0 6 -4 10 -10 13 c-6 -3 -10 -7 -10 -13 z" fill="#EF4444" fill-opacity=".2" stroke="#EF4444" transform="translate(-42,-16)"/></g>

  <rect x="126" y="150" width="92" height="70" rx="8" class="node"/>
  <text x="172" y="180" text-anchor="middle" font-size="13" font-weight="700">Queue</text>
  <text x="172" y="200" text-anchor="middle" font-size="11" class="muted">SQS + DLQ</text>

  <rect x="232" y="150" width="92" height="70" rx="8" class="node"/>
  <text x="278" y="180" text-anchor="middle" font-size="13" font-weight="700">Workers</text>
  <text x="278" y="200" text-anchor="middle" font-size="11" class="muted">EC2 ASG</text>

  <rect x="338" y="150" width="92" height="70" rx="8" class="node"/>
  <rect x="338" y="150" width="92" height="70" rx="8" fill="none" stroke="#a996d6" stroke-width="2" class="pulse"/>
  <text x="384" y="180" text-anchor="middle" font-size="13" font-weight="700">Aurora</text>
  <text x="384" y="200" text-anchor="middle" font-size="11" class="muted">multi-AZ</text>

  <!-- steady stream of PRs -->
  <circle r="5" fill="#a996d6"><animateMotion dur="2.4s" repeatCount="indefinite" path="M66 98 V185 H384"/></circle>
  <circle r="5" fill="#a996d6"><animateMotion dur="2.4s" begin="-0.8s" repeatCount="indefinite" path="M66 98 V185 H384"/></circle>
  <circle r="5" fill="#a996d6"><animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite" path="M66 98 V185 H384"/></circle>

  <!-- EC2 scale out -->
  <g transform="translate(240,236)" font-size="9" class="mono">
    <g><rect width="22" height="22" rx="4" fill="#F97316" fill-opacity=".18" stroke="#F97316"/><text x="11" y="15" text-anchor="middle" class="o">ec2</text></g>
    <g transform="translate(27,0)"><g class="ec2b"><rect width="22" height="22" rx="4" fill="#F97316" fill-opacity=".18" stroke="#F97316"/><text x="11" y="15" text-anchor="middle" class="o">ec2</text></g></g>
    <g transform="translate(54,0)"><g class="ec2c"><rect width="22" height="22" rx="4" fill="#F97316" fill-opacity=".18" stroke="#F97316"/><text x="11" y="15" text-anchor="middle" class="o">ec2</text></g></g>
  </g>
  <text x="384" y="252" text-anchor="middle" font-size="11" class="mono"><tspan class="p">AZ-a</tspan><tspan class="muted"> ⇄ </tspan><tspan class="p">AZ-b</tspan></text>

  <g font-size="14">
    <g class="chk c1"><text x="24" y="304" class="p">✓</text><text x="46" y="304">Private subnets, no internet route</text></g>
    <g class="chk c2"><text x="24" y="334" class="p">✓</text><text x="46" y="334">Database never pauses, fails over</text></g>
    <g class="chk c3"><text x="24" y="364" class="p">✓</text><text x="46" y="364">WAF and a customer KMS key</text></g>
    <g class="chk c4"><text x="24" y="394" class="p">✓</text><text x="46" y="394">Scales on queue backlog, 6 alarms</text></g>
  </g>

  <text x="20" y="436" font-size="12" class="muted mono">AWS bill per month</text>
  <rect x="20" y="446" width="410" height="12" rx="6" fill="#1b222c"/>
  <rect x="20" y="446" width="410" height="12" rx="6" fill="#8E75B2" class="barF"/>
  <text x="430" y="438" text-anchor="end" font-size="16" font-weight="800" class="p">~$330</text>
</g>
</svg>
