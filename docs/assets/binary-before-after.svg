<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="t d">
<title id="t">Image before and after</title><desc id="d">A changed PNG used to show only &quot;Binary file.&quot; Now the previous version appears on the left and the new version on the right, with pixel size and file size.</desc>
<style>
text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #d9dee6; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
.muted { fill: #8592a3; }
.add { fill: #7ee08a; } .del { fill: #ff9a92; } .mod { fill: #f5a623; } .acc { fill: #7aa2f7; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.legacy { opacity: 0; animation: legacy 10s ease-in-out infinite; }
@keyframes legacy { 0%,22% { opacity: 1; } 27%,100% { opacity: 0; } }
.strike { stroke-dasharray: 150; stroke-dashoffset: 0; animation: strike 10s ease-in-out infinite; }
@keyframes strike { 0%,10% { stroke-dashoffset: 150; } 18%,100% { stroke-dashoffset: 0; } }
.summary { animation: fadein 10s ease-out infinite; }
@keyframes fadein { 0%,30% { opacity: 0; } 36%,96% { opacity: 1; } 100% { opacity: 0; } }
.left { animation: left 10s cubic-bezier(.2,.8,.2,1) infinite; }
@keyframes left { 0%,28% { opacity: 0; transform: translateX(-40px); } 36%,96% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.right { animation: right 10s cubic-bezier(.2,.8,.2,1) infinite; }
@keyframes right { 0%,32% { opacity: 0; transform: translateX(40px); } 40%,96% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.grow { transform-box: fill-box; transform-origin: center; animation: grow 10s cubic-bezier(.2,.8,.2,1) infinite; }
@keyframes grow { 0%,46% { transform: scaleX(.75); fill: #c92a2a; } 56%,100% { transform: none; fill: #2f7fde; } }
.dims { animation: dims 10s steps(1) infinite; }
@keyframes dims { 0%,52% { opacity: 0; } 53%,100% { opacity: 1; } }
.ring { fill: none; stroke: #7ee08a; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; animation: ring 10s ease-out infinite; }
@keyframes ring { 0%,56% { opacity: 0; transform: scale(1); } 60% { opacity: .9; } 72%,100% { opacity: 0; transform: scale(1.25); } }
</style>
<defs>
<pattern id="chk" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#e9ecef"/><rect width="8" height="8" fill="#cfd4da"/><rect x="8" y="8" width="8" height="8" fill="#cfd4da"/></pattern>
</defs>
<rect x="0.5" y="0.5" width="919" height="419" rx="10" fill="#0d1117" stroke="#262d38"/>
<rect x="1" y="1" width="918" height="44" rx="9" fill="#191e26"/><rect x="1" y="36" width="918" height="9" fill="#191e26"/><line x1="1" y1="45" x2="919" y2="45" stroke="#262d38"/><text x="20" y="28" class="mono mod" font-size="13" font-weight="700">M</text><text x="40" y="28" class="mono" font-size="14">logo.png</text><text x="900" y="28" class="mono muted" font-size="12" text-anchor="end">+0 -0</text><g class="legacy"><text x="460.0" y="200" class="muted" font-size="18" text-anchor="middle">Binary file.</text><line class="strike" x1="398.0" y1="194" x2="522.0" y2="194" stroke="#ff9a92" stroke-width="2"/><text x="460.0" y="240" class="muted" font-size="13" text-anchor="middle">before: you had to open the file yourself to see what changed</text></g><g class="summary"><rect x="20" y="62" width="58" height="20" rx="4" fill="none" stroke="#7d8590"/><text x="49" y="76" class="mono muted" font-size="11" font-weight="700" text-anchor="middle">IMAGE</text><text x="90" y="77" class="muted" font-size="12">225 B -&gt; 269 B (+44 B)</text></g><g class="left"><rect x="20" y="100" width="430" height="300" rx="7" fill="#13171d" stroke="#262d38"/><rect x="20" y="100" width="430" height="3" rx="1.5" fill="#ff9a92"/><text x="34" y="126" font-size="13" font-weight="700">Before (HEAD)</text><text x="142" y="126" class="muted" font-size="12">120 x 80 px, 225 B</text><text x="436" y="126" class="acc" font-size="12" text-anchor="end">Open</text><line x1="20" y1="138" x2="450" y2="138" stroke="#262d38"/><rect x="21" y="139" width="428" height="260" rx="6" fill="url(#chk)"/><rect x="175.0" y="229.0" width="120" height="80" fill="#c92a2a"/></g><g class="right"><rect x="470" y="100" width="430" height="300" rx="7" fill="#13171d" stroke="#262d38"/><rect x="470" y="100" width="430" height="3" rx="1.5" fill="#7ee08a"/><text x="484" y="126" font-size="13" font-weight="700">After (working tree)</text><g class="dims"><text x="628" y="126" class="muted" font-size="12">160 x 80 px, 269 B</text></g><text x="886" y="126" class="acc" font-size="12" text-anchor="end">Open</text><line x1="470" y1="138" x2="900" y2="138" stroke="#262d38"/><rect x="471" y="139" width="428" height="260" rx="6" fill="url(#chk)"/><rect class="grow" x="605.0" y="229.0" width="160" height="80" fill="#2f7fde"/><rect class="ring" x="593.0" y="217.0" width="184" height="104" rx="6"/></g>
</svg>
