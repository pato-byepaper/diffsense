</defs>
<rect x="0.5" y="0.5" width="919" height="315" rx="10" fill="#0d1117" stroke="#262d38"/>
<rect x="1" y="1" width="918" height="44" rx="9" fill="#191e26"/><rect x="1" y="36" width="918" height="9" fill="#191e26"/><line x1="1" y1="45" x2="919" y2="45" stroke="#262d38"/><text x="20" y="28" class="mono mod" font-size="13" font-weight="700">M</text><text x="40" y="28" class="mono" font-size="14">contract.docx</text><text x="900" y="28" class="mono muted" font-size="12" text-anchor="end">+0 -0</text><g><rect x="20" y="60" width="54" height="20" rx="4" fill="none" stroke="#7d8590"/><text x="47" y="74" class="mono muted" font-size="11" font-weight="700" text-anchor="middle">DOCX</text><text x="86" y="75" class="muted" font-size="12">3.5 KB -&gt; 3.6 KB (+29 B)</text></g><g class="stats"><text x="300" y="75" class="add" font-size="12">1 paragraph added</text><text x="420" y="75" class="del" font-size="12">0 removed</text><text x="500" y="75" class="mod" font-size="12">2 changed</text><text x="580" y="75" class="acc" font-size="12">Download before</text><text x="690" y="75" class="acc" font-size="12">Download after</text></g><rect x="20" y="92" width="880" height="204" rx="7" fill="#13171d" stroke="#262d38"/><text x="32" y="114" font-size="13" font-weight="700">Before (HEAD)</text><text x="472.0" y="114" font-size="13" font-weight="700">After (working tree)</text><line x1="20" y1="126" x2="900" y2="126" stroke="#262d38"/><line x1="460.0" y1="92" x2="460.0" y2="296" stroke="#262d38"/><g class="row r0"><text x="50" y="148" class="mono muted" font-size="12" text-anchor="end">1</text><text x="64" y="148" class="mono" font-size="14" textLength="142.8" lengthAdjust="spacingAndGlyphs">Service Agreement</text><text x="490.0" y="148" class="mono muted" font-size="12" text-anchor="end">1</text><text x="504.0" y="148" class="mono" font-size="14" textLength="142.8" lengthAdjust="spacingAndGlyphs">Service Agreement</text></g><g class="row r1"><rect class="tint" x="21" y="159" width="438.0" height="32" fill="rgba(248,81,73,.16)"/><text x="50" y="180" class="mono muted" font-size="12" text-anchor="end">2</text><text x="64" y="180" class="mono del" font-size="14" textLength="193.2" lengthAdjust="spacingAndGlyphs">The client pays within </text><rect class="mark" x="256.20000000000005" y="165" width="18.8" height="21" rx="3" fill="rgba(248,81,73,.45)"/><text x="257.2" y="180" class="mono del" font-size="14" textLength="16.8" lengthAdjust="spacingAndGlyphs">30</text><text x="274.0" y="180" class="mono del" font-size="14" textLength="50.4" lengthAdjust="spacingAndGlyphs"> days.</text><rect class="tint" x="461.0" y="159" width="438.0" height="32" fill="rgba(63,185,80,.16)"/><text x="490.0" y="180" class="mono muted" font-size="12" text-anchor="end">2</text><text x="504.0" y="180" class="mono add" font-size="14" textLength="193.2" lengthAdjust="spacingAndGlyphs">The client pays within </text><rect class="mark" x="696.2" y="165" width="18.8" height="21" rx="3" fill="rgba(63,185,80,.45)"/><text x="697.2" y="180" class="mono add" font-size="14" textLength="16.8" lengthAdjust="spacingAndGlyphs">15</text><text x="714.0" y="180" class="mono add" font-size="14" textLength="50.4" lengthAdjust="spacingAndGlyphs"> days.</text></g><g class="row r2"><rect class="tint" x="21" y="191" width="438.0" height="32" fill="rgba(248,81,73,.16)"/><text x="50" y="212" class="mono muted" font-size="12" text-anchor="end">3</text><text x="64" y="212" class="mono del" font-size="14" textLength="193.2" lengthAdjust="spacingAndGlyphs">Support is provided by </text><rect class="mark" x="256.20000000000005" y="197" width="44.0" height="21" rx="3" fill="rgba(248,81,73,.45)"/><text x="257.2" y="212" class="mono del" font-size="14" textLength="42.0" lengthAdjust="spacingAndGlyphs">email</text><text x="299.2" y="212" class="mono del" font-size="14" textLength="8.4" lengthAdjust="spacingAndGlyphs">.</text><rect class="tint" x="461.0" y="191" width="438.0" height="32" fill="rgba(63,185,80,.16)"/><text x="490.0" y="212" class="mono muted" font-size="12" text-anchor="end">3</text><text x="504.0" y="212" class="mono add" font-size="14" textLength="193.2" lengthAdjust="spacingAndGlyphs">Support is provided by </text><rect class="mark" x="696.2" y="197" width="128.0" height="21" rx="3" fill="rgba(63,185,80,.45)"/><text x="697.2" y="212" class="mono add" font-size="14" textLength="126.0" lengthAdjust="spacingAndGlyphs">email and phone</text><text x="823.2" y="212" class="mono add" font-size="14" textLength="8.4" lengthAdjust="spacingAndGlyphs">.</text></g><g class="row r3"><rect x="21" y="223" width="438.0" height="32" fill="rgba(255,255,255,.025)"/><rect class="tint" x="461.0" y="223" width="438.0" height="32" fill="rgba(63,185,80,.16)"/><text x="490.0" y="244" class="mono muted" font-size="12" text-anchor="end">4</text><text x="504.0" y="244" class="mono add" font-size="14" textLength="268.8" lengthAdjust="spacingAndGlyphs">A late fee of 2 percent applies.</text></g><g class="row r4"><text x="50" y="276" class="mono muted" font-size="12" text-anchor="end">4</text><text x="64" y="276" class="mono" font-size="14" textLength="243.6" lengthAdjust="spacingAndGlyphs">This agreement renews yearly.</text><text x="490.0" y="276" class="mono muted" font-size="12" text-anchor="end">5</text><text x="504.0" y="276" class="mono" font-size="14" textLength="243.6" lengthAdjust="spacingAndGlyphs">This agreement renews yearly.</text></g><g class="ptr"><path transform="translate(705.2,170)" d="M0 0 L0 16 L4.5 12 L7.5 19 L10 18 L7 11 L12.5 11 Z" fill="#ffffff" stroke="#0d1117" stroke-width="1"/></g>
