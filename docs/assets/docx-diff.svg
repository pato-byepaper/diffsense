<svg xmlns="http://www.w3.org/2000/svg" width="920" height="316" viewBox="0 0 920 316" role="img" aria-labelledby="t d">
<title id="t">Word document text diff</title><desc id="d">A changed .docx shows its text side by side: paragraphs before on the left and after on the right, changed paragraphs tinted and the exact changed words highlighted.</desc>
<style>
text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #d9dee6; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
.muted { fill: #8592a3; }
.add { fill: #7ee08a; } .del { fill: #ff9a92; } .mod { fill: #f5a623; } .acc { fill: #7aa2f7; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.row { animation: row 10s ease-out infinite; }
.tint { animation: tint 10s ease-out infinite; }
@keyframes tint { 0%,30% { opacity: 0; } 38%,96% { opacity: 1; } 100% { opacity: 0; } }
.mark { transform-box: fill-box; transform-origin: left center; animation: mark 10s cubic-bezier(.2,.8,.2,1) infinite; }
@keyframes mark { 0%,44% { transform: scaleX(0); } 54%,96% { transform: none; } 100% { transform: scaleX(0); } }
.stats { animation: stats 10s ease-out infinite; }
@keyframes stats { 0%,56% { opacity: 0; } 62%,96% { opacity: 1; } 100% { opacity: 0; } }
.ptr { animation: ptr 10s ease-in-out infinite; }
@keyframes ptr { 0%,62% { opacity: 0; transform: translateY(0); } 66% { opacity: 1; } 80% { opacity: 1; transform: translateY(30px); } 92%,100% { opacity: 0; transform: translateY(30px); } }
.r0 { animation-name: r0; } @keyframes r0 { 0%,2% { opacity: 0; transform: translateY(6px); } 7%,96% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.r1 { animation-name: r1; } @keyframes r1 { 0%,6% { opacity: 0; transform: translateY(6px); } 11%,96% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.r2 { animation-name: r2; } @keyframes r2 { 0%,10% { opacity: 0; transform: translateY(6px); } 15%,96% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.r3 { animation-name: r3; } @keyframes r3 { 0%,14% { opacity: 0; transform: translateY(6px); } 19%,96% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.r4 { animation-name: r4; } @keyframes r4 { 0%,18% { opacity: 0; transform: translateY(6px); } 23%,96% { opacity: 1; transform: none; } 100% { opacity: 0; } }
</style>
<defs>
